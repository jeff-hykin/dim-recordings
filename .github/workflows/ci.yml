name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-14]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            # pulls from dimos-desktop.cachix.org; pushes what it builds only when the CACHIX_AUTH_TOKEN secret is set
            - uses: cachix/cachix-action@v16
              with:
                  name: dimos-desktop
                  authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
            - run: nix build .#dimosApp -L
            # the Linux cross builds dimos.yaml's `nix:` points robots at (built on the Mac runner: the attribute is under aarch64-darwin)
            - if: runner.os == 'macOS'
              run: nix build --no-link .#dimosApp-aarch64-linux .#dimosApp-x86_64-linux -L # --no-link: ./result stays the native build the steps below run
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.5.0 # the formatter changes between releases: pin the one `deno fmt` runs with locally
            # the stream-edit tests load sqlite-vec (an embedding index), the same one the server uses
            - run: echo "DIM_RECORDINGS_SQLITE_VEC=$(nix build --no-link --print-out-paths .#sqliteVec)/lib/vec0" >> "$GITHUB_ENV"
            - run: deno task test
            - run: deno task check
            - run: cd frontend && npm ci && npm run typecheck
            - run: deno fmt --check && deno lint
